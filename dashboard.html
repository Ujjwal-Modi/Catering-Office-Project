<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>Dashboard · Catering Office</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="booting">
  <div class="app" id="app">
    <main class="main">
      <div class="page" id="page">
        <div class="grid-4" id="stats"><div class="loading">Loading…</div></div>

        <div class="grid-2 mt">
          <section class="card">
            <div class="card-head">
              <h3>⚠️ Needs attention <span class="badge badge-amber" id="attention-count">0</span></h3>
            </div>
            <p class="small muted" id="attention-sub"></p>
            <div id="attention"></div>
          </section>
          <section class="card">
            <div class="card-head"><h3>☀️ Today's items</h3></div>
            <div id="today"></div>
          </section>
        </div>

        <div class="page-head mt">
          <h2>Ongoing &amp; next 14 days</h2>
          <a class="btn btn-primary" href="projects.html">All projects</a>
        </div>
        <div id="active-projects"></div>
      </div>
    </main>
  </div>
  <script type="module" src="js/pages/dashboard.js"></script>
</body>
</html>
