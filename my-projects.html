<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>My Projects · Catering Office</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="booting">
  <div class="app" id="app">
    <main class="main">
      <div class="page" id="page">
        <div class="page-head">
          <h2 id="hello">Hello</h2>
        </div>

        <div class="toolbar">
          <div class="search"><input id="search" type="search" placeholder="Search projects…" data-i18n-placeholder /></div>
          <select id="status-filter">
            <option value="" data-i18n>All</option>
            <option value="ongoing" data-i18n>Ongoing</option>
            <option value="upcoming" data-i18n>Upcoming</option>
            <option value="completed" data-i18n>Completed</option>
          </select>
        </div>

        <div class="grid-3" id="list"><div class="loading" data-i18n>Loading…</div></div>
      </div>
    </main>
  </div>
  <script type="module" src="js/pages/my-projects.js"></script>
</body>
</html>
