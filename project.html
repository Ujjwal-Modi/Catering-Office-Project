<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>Project · Catering Office</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="booting">
  <div class="app" id="app">
    <main class="main">
      <div class="page" id="page">
        <div id="blocked" hidden></div>
        <div id="project-body">
        <div id="project-head"><div class="loading" data-i18n>Loading project…</div></div>
        <div id="freeze-banner" class="banner mt" hidden></div>

        <nav class="tabs mt">
          <button class="tab active" data-tab="items"><span data-i18n>Items</span> <span class="count" id="count-items">0</span></button>
          <!-- PHOTOS DISABLED: un-comment to bring back the Photos tab
          <button class="tab" data-tab="photos">Photos <span class="count" id="count-photos">0</span></button>
          -->
          <button class="tab" data-tab="summary" data-i18n>Summary</button>
        </nav>

        <section data-panel="items">
          <div id="add-card" class="mb"></div>
          <div class="toolbar">
            <select id="f-date"></select>
            <select id="f-slot">
              <option value="" data-i18n>All times</option>
              <option value="Morning" data-i18n>Morning</option>
              <option value="Afternoon" data-i18n>Afternoon</option>
              <option value="Evening" data-i18n>Evening</option>
              <option value="Night" data-i18n>Night</option>
            </select>
            <select id="f-type"></select>
            <select id="f-status">
              <option value="" data-i18n>Any status</option>
              <option value="pending" data-i18n>Not ordered</option>
              <option value="ordered" data-i18n>Ordered</option>
              <option value="short" data-i18n>Short received</option>
              <option value="received" data-i18n>Received</option>
            </select>
            <div class="search"><input id="f-search" type="search" placeholder="Search vendor, remark…" data-i18n-placeholder /></div>
          </div>
          <div id="entries"></div>
        </section>

        <!-- PHOTOS DISABLED: un-comment to bring back the Photos panel
        <section data-panel="photos" hidden>
          <div id="upload-card" class="mb"></div>
          <div class="chips mb" id="bucket-chips"></div>
          <div id="photo-grid"></div>
        </section>
        -->

        <section data-panel="summary" hidden>
          <div id="summary"></div>
        </section>
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="js/pages/project.js"></script>
</body>
</html>
