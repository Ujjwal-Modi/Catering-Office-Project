<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>Users · Catering Office</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="booting">
  <div class="app" id="app">
    <main class="main">
      <div class="page" id="page">
        <div class="page-head">
          <h2>Users &amp; admins</h2>
          <button class="btn btn-primary" id="new-btn">+ Create user</button>
        </div>

        <div class="toolbar">
          <div class="search"><input id="search" type="search" placeholder="Search name, login, phone…" /></div>
          <select id="role-filter">
            <option value="">Everyone</option>
            <option value="admin">Admins</option>
            <option value="user">Staff</option>
            <option value="inactive">Inactive</option>
          </select>
        </div>

        <div id="list"><div class="loading">Loading…</div></div>
      </div>
    </main>
  </div>
  <script type="module" src="js/pages/users.js"></script>
</body>
</html>
