<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>My Profile · Catering Office</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="booting">
  <div class="app" id="app">
    <main class="main">
      <div class="page" id="page">
        <div class="grid-2">
          <form class="card" id="profile-form" novalidate>
            <div class="card-head"><h3 data-i18n>My details</h3></div>
            <div class="form-grid">
              <div class="field"><label class="req" for="name" data-i18n>Name</label><input id="name" name="name" required /></div>
              <div class="field"><label for="phone" data-i18n>Phone</label><input id="phone" name="phone" type="tel" /></div>
              <div class="field"><label for="login-id" data-i18n>Login ID</label><input id="login-id" disabled /></div>
              <div class="field"><label for="role" data-i18n>Role</label><input id="role" disabled /></div>
            </div>
            <div class="gap mt" style="justify-content:flex-end"><button class="btn btn-primary" type="submit" data-i18n>Save</button></div>
          </form>

          <form class="card" id="password-form" novalidate>
            <div class="card-head"><h3 data-i18n>Change password</h3></div>
            <div class="form-grid">
              <div class="field"><label class="req" for="current" data-i18n>Current password</label><input id="current" name="current" type="password" autocomplete="current-password" required /></div>
              <div class="field"><label class="req" for="next" data-i18n>New password</label><input id="next" name="next" type="password" minlength="6" autocomplete="new-password" required /></div>
              <div class="field"><label class="req" for="confirm" data-i18n>Confirm new password</label><input id="confirm" name="confirm" type="password" minlength="6" autocomplete="new-password" required /></div>
            </div>
            <div class="gap mt" style="justify-content:flex-end"><button class="btn btn-primary" type="submit" data-i18n>Change password</button></div>
          </form>
        </div>
        <p class="mt"><button class="btn btn-ghost" id="logout" data-i18n>Log out</button></p>
      </div>
    </main>
  </div>
  <script type="module" src="js/pages/profile.js"></script>
</body>
</html>
