<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f766e" />
  <title>First-time setup · Catering Office</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">🔑</div>
      <h1>Create root admin</h1>
      <p class="muted">This is done only once. The root admin can create other admins and staff.</p>

      <div id="done" class="banner banner-info" hidden>
        Setup is already complete. <a href="index.html">Go to sign in</a>
      </div>

      <form id="setup-form" novalidate hidden>
        <div class="field">
          <label class="req" for="name">Full name</label>
          <input id="name" name="name" required />
        </div>
        <div class="field">
          <label for="phone">Phone</label>
          <input id="phone" name="phone" type="tel" inputmode="tel" />
        </div>
        <div class="field">
          <label class="req" for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
          <span class="hint">Use a real email so you can reset the password.</span>
        </div>
        <div class="field">
          <label class="req" for="password">Password</label>
          <input id="password" name="password" type="password" minlength="6" autocomplete="new-password" required />
        </div>
        <button class="btn btn-primary btn-block" type="submit">Create root admin</button>
      </form>
    </div>
  </main>
  <script type="module" src="js/pages/setup.js"></script>
</body>
</html>
